<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bootstrap/bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/css/bootstrap.css">
</head>

<body>
  <div class="container">

    <p><label for="input">Country Name : </label><input type="text" id="input" placeholder="pakistan" /></p>
    <button id="submitBtn">Submit</button>

    <div class="card" style="width: 18rem;">
      <img src="" class="card-img-top" alt="flag">
      <div class="card-body">
        <h5 class="card-title"></h5>
        <p class="card-text">My country Name is <span class="name"></span> and it's capital is <span
            class="capital"></span></p>
        <div class="all-borders"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
